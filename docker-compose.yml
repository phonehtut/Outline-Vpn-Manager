services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: outline-manager:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN:-outline-manager.example.com}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-outline_manager}
      DB_USERNAME: ${DB_USERNAME:-outline_manager}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  migrate:
    image: outline-manager:latest
    restart: "no"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN:-outline-manager.example.com}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-outline_manager}
      DB_USERNAME: ${DB_USERNAME:-outline_manager}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: outline-manager-web:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_started
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.outline-manager.rule=Host(`${APP_DOMAIN:-outline-manager.example.com}`)
      - traefik.http.routers.outline-manager.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.outline-manager.tls=true
      - traefik.http.routers.outline-manager.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.outline-manager.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue-worker:
    image: outline-manager:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-outline_manager}
      DB_USERNAME: ${DB_USERNAME:-outline_manager}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  scheduler:
    image: outline-manager:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-outline_manager}
      DB_USERNAME: ${DB_USERNAME:-outline_manager}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-outline_manager}
      POSTGRES_USER: ${DB_USERNAME:-outline_manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  database_data:

networks:
  internal:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
